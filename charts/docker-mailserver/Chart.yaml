apiVersion: v2
appVersion: "17.0.0"
description: A fullstack but simple mailserver (smtp, imap, antispam, antivirus, ssl...) using Docker.
name: docker-mailserver
version: 7.1.0
sources:
- https://github.com/docker-mailserver/docker-mailserver-helm
maintainers:
- name: funkypenguin
  email: davidy@funkypenguin.co.nz
keywords:
- mailserver
- postfix
- dovecot
- amavis
- imap
home: https://github.com/docker-mailserver/docker-mailserver-helm
icon: https://avatars.githubusercontent.com/u/76868633?s=400&v=4

annotations:
  artifacthub.io/changes: |
    - The Rspamd web interface and metrics are served on a ClusterIP Service, <fullname>-internal, instead of the main Service
