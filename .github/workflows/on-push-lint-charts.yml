name: Lint and Test Charts

on:
  push:
    paths:
      - 'charts/**'
      - '.github/**'
      - '.ci/**'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/**'
      - '.ci/**'
  workflow_dispatch:

# Pin every tool so that results don't change underneath us. In particular, test
# snapshots depend on the exact Helm and helm-unittest versions, so regenerate them
# with these versions (see TESTING.md).
env:
  HELM_VERSION: v4.3.1
  HELM_UNITTEST_VERSION: v1.2.1
  KUBE_SCORE_VERSION: 1.20.0

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kube-score
        run: |
          mkdir /tmp/bin
          wget https://github.com/zegl/kube-score/releases/download/v${{ env.KUBE_SCORE_VERSION }}/kube-score_${{ env.KUBE_SCORE_VERSION }}_linux_amd64 -O /tmp/bin/kube-score
          chmod 755 /tmp/bin/kube-score

      - name: Kube-score generated manifests
        env:
          KUBE_SCORE: /tmp/bin/kube-score
        run: .ci/scripts/kube-score.sh

  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Helm 4 verifies plugin signatures by default, which plugins installed from git don't have
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.HELM_UNITTEST_VERSION }} --verify=false

      - name: Run helm unittest
        run: helm unittest charts/*

  chart-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node images for the kind version used by helm/kind-action, see
        # https://github.com/kubernetes-sigs/kind/releases
        KubeVersion: [ 1.35.8, 1.36.4, 1.37.0 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # python is a requirement for the chart-testing action below (supports yamllint among other tests)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .ci/ct-config.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .ci/ct-config.yaml

      - name: Create ${{matrix.KubeVersion}} kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          node_image: kindest/node:v${{matrix.KubeVersion}}
          cluster_name: kubernetes-${{matrix.KubeVersion}}
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install) against ${{matrix.KubeVersion}}
        run: ct install --config .ci/ct-config.yaml
